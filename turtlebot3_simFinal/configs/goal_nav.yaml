# Goal-directed navigation with a HIDDEN goal (observation is still LiDAR-only).
# Reward terms are recovered from the commented-out code in dqn_environment.py:
#   reward = yaw_reward + obstacle_reward
#   goal reached (< 0.20 m): reward = 100      collision: reward = -50
# They were commented out in favour of reward = 1.0 in your live code, so this
# is NOT claimed to match any previous experiment.

task:
  mode: goal_navigation

spawn:
  mode: random

goal:
  mode: random_grid            # lattice of dqn_gazebo.generate_goal_pose, free space only

reward:
  per_step: 0.0
  yaw_coef: 1.0
  obstacle_coef: 1.0
  goal_reward: 100.0
  collision_penalty: -50.0
  terminal_mode: replace
