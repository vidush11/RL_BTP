# Obstacle-rich, randomized scenario for training + evaluating ALL demons,
# especially the LEFT / RIGHT TTC demons.
#
# Why: in the open arena the hard-turn policies circle forever (gamma never
# terminates) -> their TTC GVF is unbounded and every eval episode is censored.
# With obstacles in reach of the ~0.2 m turning circle, those policies DO
# collide a meaningful fraction of the time (≈50%), giving valid, varied TTC
# targets (up to ~60 steps); the remaining episodes stay correctly CENSORED
# (no threat on the circle). Random spawn + random obstacles means each episode
# is a fresh scenario, so evaluating on unseen seeds tests generalization.
#
# Reproducibility: reset(seed=s) fixes the obstacle layout and spawn stream, so
# train and eval use disjoint seeds (train 0, eval 2000+).
seed: null
world:
  randomize_obstacles: true
  random_obstacle_count: 10
  random_obstacle_size_range: [0.2, 0.5]
spawn:
  mode: random
  clearance: 0.2
goal:
  mode: random_grid
  clearance: 0.2
  min_distance_from_robot: 0.5
termination:
  collision_lidar_threshold: 0.15
  max_episode_steps: 800
